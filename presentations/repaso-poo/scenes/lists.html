<!--
  lists: the menu board holds the flavour tubs in a row, each with its index under it (0, 1, 2).
  sabores[1] lights up fresa ("starts at 0"); append adds arándano at index 3 and len gives 4.
  The chocolate tub is `.tub-chocolate` (scene 12 grows out of it).
-->
<template>
  <style>
    .lit { fill: none; stroke: var(--accent-2); stroke-width: 10; stroke-linejoin: round; }
  </style>
</template>
<script src="/player/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="/library/shared/scene-kit.js"></script>
<script src="/library/shared/sticker-kit.js"></script>
<script src="/library/shared/code-panel.js"></script>
<script src="kit.js"></script>
<script>
  (function () {
    const { svg, canvas } = window.sceneKit;
    const sk = window.stickerKit;
    const { shop } = window;
    const BOARD = { x: 140, y: 250, w: 1060, h: 500 };
    const XS = [290, 520, 750, 980];
    const TUB_Y = 440;

    function slot(parent, flavor, name, i) {
      const g = svg("g", { class: `tub-${flavor}` }, parent);
      shop.tub(g, XS[i], TUB_Y, flavor);
      sk.stickerText(g, name, XS[i], 610, 40);
      const index = shop.tag(g, String(i), XS[i], 690, { mono: true, size: 40 });
      return { g, index };
    }

    registerScene({
      id: "lists",
      props: {
        headline: "Listas", // headline, top left
        flavors: [["vainilla", "vainilla"], ["fresa", "fresa"], ["chocolate", "chocolate"]], // [scoop class, label]
        added: ["arandano", "arándano"], // flavour appended at the last step
        code: ['sabores = ["vainilla", "fresa", "chocolate"]', "sabores[1]", 'sabores.append("arándano")'], // one line per step
        result: '"fresa"', // what sabores[1] gives
        fromZero: "empieza en 0", // pill at "indice"
        length: "len(sabores) → 4", // tag at the last step
      },
      steps: ["lista", "indice", "agregar"],
      build(root, props, gsap) {
        shop.setup(root);
        const stage = canvas(root);
        const tl = gsap.timeline();
        shop.headline(tl, root, props.headline, 0);
        const board = svg("g", {}, stage);
        sk.sticker(board, "rect", { x: BOARD.x, y: BOARD.y, width: BOARD.w, height: BOARD.h, rx: 32 }, "panel-navy", 10);
        sk.stickerText(board, "Menú", BOARD.x + 110, BOARD.y + 60, 48);
        tl.from(board, { opacity: 0, scale: 0.95, svgOrigin: "670 500", duration: 0.5, ease: "expo.out" }, 0.2);
        const code = shop.code(root, props.code, 160, 800);

        // lista: three tubs with their indexes; the list line
        let at = tl.duration();
        props.flavors.forEach(([flavor, name], i) => {
          const s = slot(stage, flavor, name, i);
          shop.pop(tl, s.g, XS[i], 520, at + i * 0.12);
        });
        shop.typeIn(tl, [code.lineEls[0]], at + 0.3);
        tl.addLabel("lista");

        // indice: sabores[1] lights up fresa
        at = tl.duration();
        shop.typeIn(tl, [code.lineEls[1]], at);
        const bar = shop.barIn(tl, code, [1], at + 0.3);
        const lit = svg("rect", { x: XS[1] - 110, y: 350, width: 220, height: 380, rx: 30, class: "lit" }, stage);
        tl.from(lit, { drawSVG: 0, duration: 0.5, ease: "power2.inOut" }, at + 0.4);
        const result = shop.tag(stage, props.result, 560, 890, { mono: true, tone: "accent" });
        shop.pop(tl, result, 560, 890, at + 0.8);
        const zero = shop.tag(stage, props.fromZero, 1500, 690, { tone: "blue", rot: -3 });
        shop.pop(tl, zero, 1500, 690, at + 1.0);
        tl.addLabel("indice");

        // agregar: append puts arándano at the end, index 3; len gives 4
        at = tl.duration();
        shop.barOut(tl, bar, at);
        tl.to([lit, result], { opacity: 0, duration: 0.25, ease: "power3.in" }, at);
        shop.typeIn(tl, [code.lineEls[2]], at + 0.1);
        shop.barIn(tl, code, [2], at + 0.5);
        const added = slot(stage, props.added[0], props.added[1], 3);
        tl.from(added.g, { x: 700, opacity: 0, duration: 0.7, ease: "power3.out" }, at + 0.6);
        const len = shop.tag(stage, props.length, 1500, 950, { mono: true });
        shop.pop(tl, len, 1500, 950, at + 1.2);
        tl.addLabel("agregar");
        return tl;
      },
    });
  })();
</script>
