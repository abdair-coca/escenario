<!--
  abstraction: Robi's chest lid lifts to show the gears and closes again: to use it you only need the two
  buttons. Then Robot becomes an abstract class (ABC, @abstractmethod): its card turns dashed, building one
  directly fails with TypeError, and the child classes must implement trabajar().
-->
<template>
  <style>
    .gear { fill: var(--accent-3); stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
    .gear--soft { fill: var(--blue-mid); }
    .hub { fill: var(--paper); stroke: var(--ink); stroke-width: 4; }
    .button { fill: var(--accent); stroke: var(--ink); stroke-width: 5; }
    .hole { fill: var(--paper); stroke: var(--ink); stroke-width: 6; }
  </style>
</template>
<script src="/player/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="/library/shared/scene-kit.js"></script>
<script src="/library/shared/sticker-kit.js"></script>
<script src="/library/shared/code-panel.js"></script>
<script src="kit.js"></script>
<script>
  (function () {
    const { svg, text, canvas } = window.sceneKit;
    const sk = window.stickerKit;
    const { shop } = window;
    const ROBI = { x: 400, y: 620, s: 1.05 };

    function gear(parent, cx, cy, r, teeth, cls) {
      const points = [];
      for (let i = 0; i < teeth * 2; i += 1) {
        const a = (Math.PI * i) / teeth;
        const rr = i % 2 ? r * 0.78 : r;
        points.push(`${(cx + rr * Math.cos(a)).toFixed(1)},${(cy + rr * Math.sin(a)).toFixed(1)}`);
      }
      const g = svg("g", {}, parent);
      svg("polygon", { points: points.join(" "), class: `gear ${cls}` }, g);
      svg("circle", { cx, cy, r: r * 0.28, class: "hub" }, g);
      return g;
    }

    registerScene({
      id: "abstraction",
      props: {
        headline: "Abstracción", // headline, top left
        code: [
          "from abc import ABC, abstractmethod",
          "",
          "class Robot(ABC):",
          "    @abstractmethod",
          "    def trabajar(self):",
          "        pass",
        ], // abstract class on the right
        buttons: ["trabajar()", "cargar()"], // what the user of Robi sees
        abstractPill: "abstracta", // pill on the dashed card
        call: 'Robot("X")', // trying to build one
        error: "TypeError", // what that raises
        children: ["RobotHeladero", "RobotCajero"], // classes that implement trabajar()
        rule: "las hijas deben implementarlo", // sentence over the children
      },
      steps: ["ocultar", "abstracta", "error", "obliga"],
      build(root, props, gsap) {
        shop.setup(root);
        const stage = canvas(root);
        const tl = gsap.timeline();
        shop.headline(tl, root, props.headline, 0);

        // Robi with gears inside the chest, a lid with the two buttons over them
        const robi = shop.robot(stage, ROBI.x, ROBI.y, { s: ROBI.s, tone: "soft", name: "Robi" });
        const inside = svg("g", {}, robi.body);
        svg("rect", { x: -100, y: -84, width: 200, height: 180, rx: 30, class: "hole" }, inside);
        gear(inside, -34, -10, 52, 9, "");
        gear(inside, 46, 50, 36, 7, "gear--soft");
        const lid = svg("g", {}, robi.body);
        sk.sticker(lid, "rect", { x: -108, y: -92, width: 216, height: 196, rx: 34 }, "rb rb--soft", 6);
        const btns = [-46, 46].map((lx) => {
          svg("circle", { cx: lx + 5, cy: 30, r: 26, class: "shade" }, lid);
          return svg("circle", { cx: lx, cy: 25, r: 26, class: "button" }, lid);
        });
        tl.from(robi.g, { scale: 0.85, opacity: 0, svgOrigin: `${ROBI.x} ${ROBI.y}`, duration: 0.5, ease: "expo.out" }, 0.1);
        const tags = props.buttons.map((name, i) => {
          const p = robi.at(i ? 46 : -46, 25);
          const y = 560 + i * 110;
          const leader = shop.leader(stage, { x: 690, y }, p);
          const t = shop.tag(stage, name, 790, y, { mono: true, rot: i ? 2 : -2 });
          tl.from(leader, { drawSVG: 0, duration: 0.35, ease: "power2.out" }, 0.5 + i * 0.1);
          shop.pop(tl, t, 790, y, 0.6 + i * 0.1);
          return t;
        });

        // ocultar: the lid lifts to show the gears, then closes; only the buttons stay
        let at = tl.duration();
        tl.to(lid, { y: -230, duration: 0.5, ease: "power2.inOut" }, at);
        tl.to(lid, { y: 0, duration: 0.4, ease: "power3.in" }, at + 1.4);
        btns.forEach((b, i) => shop.press(tl, tags[i], at + 1.9 + i * 0.1));
        tl.addLabel("ocultar");

        // abstracta: the code types in; a dashed Robot card with its pill
        at = tl.duration();
        const code = shop.code(root, props.code, 960, 260);
        shop.typeIn(tl, code.lineEls, at);
        shop.barIn(tl, code, [3, 4], at + 1.0);
        const card = shop.card(stage, 980, 680, 400, "Robot", ["trabajar()"], { band: 76, row: 56, dashed: true });
        shop.pop(tl, card.g, 1180, 756, at + 1.1);
        const pill = shop.tag(stage, props.abstractPill, 1330, 676, { tone: "blue", rot: 6 });
        shop.pop(tl, pill, 1330, 676, at + 1.4);
        tl.addLabel("abstracta");

        // error: Robot("X") bumps on the dashed card and raises TypeError
        at = tl.duration();
        const call = shop.tag(stage, props.call, 1630, 780, { mono: true });
        shop.pop(tl, call, 1630, 780, at);
        const leader = shop.leader(stage, { x: 1630 - call.width / 2 - 10, y: 780 }, { x: 1392, y: 780 });
        tl.from(leader, { drawSVG: 0, duration: 0.35, ease: "power2.out" }, at + 0.3);
        const no = shop.mark(stage, 1440, 780, false, 30);
        shop.pop(tl, no, 1440, 780, at + 0.6);
        const err = shop.tag(stage, props.error, 1630, 870, { mono: true, tone: "block" });
        shop.pop(tl, err, 1630, 870, at + 0.7);
        tl.addLabel("error");

        // obliga: the children implement trabajar(); a tick for each
        at = tl.duration();
        tl.to([call, leader, no, err], { opacity: 0, duration: 0.25, ease: "power3.in" }, at);
        const rule = text(stage, props.rule, { x: 980, y: 900, class: "t40", "dominant-baseline": "central" });
        tl.from(rule, { opacity: 0, y: 16, duration: 0.4, ease: "expo.out" }, at + 0.25);
        [[1140, 1355], [1565, 1755]].forEach(([tx, mx], i) => {
          const t = shop.tag(stage, props.children[i], tx, 975, { mono: true });
          shop.pop(tl, t, tx, 975, at + 0.5 + i * 0.25);
          const ok = shop.mark(stage, mx, 975, true, 30);
          shop.pop(tl, ok, mx, 975, at + 0.7 + i * 0.25);
        });
        tl.addLabel("obliga");
        return tl;
      },
    });
  })();
</script>
