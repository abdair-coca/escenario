<!--
  constructor: a robot factory with a window. Robot("Robi") drops into the slot; an empty robot appears
  inside with the tag "self = este robot"; the two self lines of __init__ light up one by one and fill the
  name and the battery; Robi rolls out and the variable robi points at it. Its battery is `.battery`
  (scene 5 zooms into it).
-->
<template>
  <style>
    .machine { fill: var(--accent); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
    .window { fill: var(--paper); stroke: var(--ink); stroke-width: 6; }
    .slot-hole { fill: var(--accent-3); stroke: var(--ink); stroke-width: 6; }
    .rivet { fill: var(--accent-2); stroke: var(--ink); stroke-width: 4; }
  </style>
</template>
<script src="/player/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="/library/shared/scene-kit.js"></script>
<script src="/library/shared/sticker-kit.js"></script>
<script src="/library/shared/code-panel.js"></script>
<script src="kit.js"></script>
<script>
  (function () {
    const { svg, canvas } = window.sceneKit;
    const sk = window.stickerKit;
    const { shop } = window;
    const M = { x: 180, y: 400, w: 640, h: 500 }; // machine body
    const W = { x: 280, y: 450, w: 440, h: 410 }; // window
    const BOT = { x: 500, y: 660, s: 0.62 };
    const OUT = { x: 1300, y: 800 }; // where Robi stops after rolling out

    registerScene({
      id: "constructor",
      props: {
        headline: "El constructor: __init__", // headline, top left
        call: 'Robot("Robi")', // pill that drops into the slot
        code: [
          "def __init__(self, nombre):",
          "    self.nombre = nombre",
          "    self.bateria = 100",
        ], // constructor on the right
        selfNote: "self = este robot", // tag under the machine
        name: "Robi", // value written on the name tag
        battery: "100", // value written on the battery
        variable: "robi", // tag that points at the finished robot
      },
      steps: ["llamada", "self", "rellena", "sale"],
      build(root, props, gsap) {
        shop.setup(root);
        const stage = canvas(root);
        const tl = gsap.timeline();

        // Entrance: the machine, the code, the headline
        const machine = svg("g", {}, stage);
        sk.sticker(machine, "rect", { x: M.x, y: M.y, width: M.w, height: M.h, rx: 40 }, "machine", 10);
        svg("rect", { x: W.x, y: W.y, width: W.w, height: W.h, rx: 28, class: "window" }, machine);
        svg("rect", { x: 430, y: 380, width: 140, height: 40, rx: 12, class: "slot-hole" }, machine);
        for (const [x, y] of [[214, 434], [786, 434], [214, 866], [786, 866]]) svg("circle", { cx: x, cy: y, r: 12, class: "rivet" }, machine);
        tl.from(machine, { scale: 0.9, opacity: 0, svgOrigin: "500 650", duration: 0.5, ease: "expo.out" }, 0);
        shop.headline(tl, root, props.headline, 0.2);
        const code = shop.code(root, props.code, 1010, 380);
        shop.typeIn(tl, code.lineEls, 0.5);

        // llamada: the call drops into the slot
        let at = tl.duration();
        const pill = shop.tag(stage, props.call, 500, 310, { mono: true, tone: "blue" });
        tl.from(pill, { y: -90, opacity: 0, duration: 0.5, ease: "power3.in" }, at);
        tl.fromTo(pill, { scaleY: 0.85 }, { scaleY: 1, svgOrigin: "500 342", duration: 0.25, ease: "back.out(2)" }, at + 0.5);
        shop.press(tl, machine, at + 0.6);
        tl.addLabel("llamada");

        // self: an empty robot appears in the window; its tag says what self is
        at = tl.duration();
        const built = svg("g", {}, stage);
        const bot = shop.robot(built, BOT.x, BOT.y, { s: BOT.s, tone: "soft", battery: "", level: 0 });
        const blankName = shop.tag(built, "?", BOT.x, 818, { mono: true });
        shop.pop(tl, bot.g, BOT.x, BOT.y, at);
        shop.pop(tl, blankName, BOT.x, 818, at + 0.15);
        const selfTag = shop.tag(stage, props.selfNote, 500, 975, { mono: true, tone: "blue", rot: -2 });
        shop.pop(tl, selfTag, 500, 975, at + 0.4);
        tl.addLabel("self");

        // rellena: line 1 fills the name, line 2 fills the battery
        at = tl.duration();
        shop.barIn(tl, code, [1], at);
        const nameTag = shop.tag(built, props.name, BOT.x, 818, { mono: true, tone: "navy" });
        shop.swap(tl, blankName, nameTag, at + 0.3);
        shop.barIn(tl, code, [2], at + 0.9);
        tl.to(bot.battery.level, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, at + 1.1);
        const full = shop.batteryNumber(bot, props.battery);
        tl.from(full, { opacity: 0, y: -16, duration: 0.4, ease: "expo.out" }, at + 1.3);
        tl.addLabel("rellena");

        // sale: Robi rolls out of the machine; the variable points at it
        at = tl.duration();
        tl.to(selfTag, { opacity: 0, duration: 0.25, ease: "power3.in" }, at);
        tl.to(built, { x: OUT.x - BOT.x, y: OUT.y - BOT.y, duration: 0.9, ease: "power2.inOut" }, at);
        const leader = shop.leader(stage, { x: 1580, y: 740 }, { x: 1400, y: 740 });
        const varTag = shop.tag(stage, props.variable, 1660, 740, { mono: true, rot: 3 });
        tl.from(leader, { drawSVG: 0, duration: 0.35, ease: "power2.out" }, at + 0.9);
        shop.pop(tl, varTag, 1660, 740, at + 1.0);
        tl.addLabel("sale");
        return tl;
      },
    });
  })();
</script>
