<!--
  inside-boil: the «dentro» zone fills the screen. The warm carton is on the left, a big coil of tube on the
  right. Small blue droplets enter the coil at the bottom; the carton's heat (orange arrows) reaches it and the
  droplets in the upper turns grow into white bubbles: the liquid boils and leaves as gas.
-->
<template>
  <style></style>
</template>
<script src="/player/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="/library/shared/scene-kit.js"></script>
<script src="kit.js"></script>
<script>
  (function () {
    const { svg, canvas, writeIn, block } = window.sceneKit;
    const nv = window.nevera;
    const TUBE = 60; // inner width of the tube
    const GAP = 105; // distance between neighbours along the tube

    // The coil: liquid enters at the bottom, runs rise turn by turn. Everything in canvas pixels.
    function coilRoute() {
      return nv.route(760, 960)
        .line(760, 800).line(1180, 800).arc(1180, 750, 50, 90, -90)
        .line(760, 700).arc(760, 650, 50, 90, 270).mark("boil")
        .line(1180, 600).arc(1180, 550, 50, 90, -90)
        .line(760, 500).arc(760, 450, 50, 90, 270)
        .line(1180, 400);
    }

    registerScene({
      id: "inside-boil",
      props: {
        headline: "Dentro: el líquido hierve", // headline, top left
        zone: "dentro", // title band of the zone
        cold: "líquido muy frío", // label of the liquid at the coil's inlet
        boil: "hierve", // pill on the boiling part
        gasLines: ["gas, con el calor", "de la leche"], // two-line label of the gas leaving
      },
      steps: ["bobina", "calor", "hierve", "gas"],
      build(root, props, gsap) {
        nv.setup(root);
        const stage = canvas(root);
        const zoneLayer = svg("g", {}, stage);
        const cartonLayer = svg("g", {}, stage);
        const tubeLayers = nv.tubeLayers(stage);
        const dotLayer = svg("g", {}, stage);
        const arrowLayer = svg("g", {}, stage);
        const labelLayer = svg("g", {}, stage);
        const tl = gsap.timeline();
        const coil = coilRoute();
        const exit = nv.route(1180, 400).line(1700, 400);

        // Entrance: the headline, the zone, the carton on its shelf with the warm badge, a cold sparkle.
        writeIn(tl, block(root, props.headline, { x: 160, y: 96, className: "t96" }), 0, 0.7);
        const zone = nv.zone(zoneLayer, { x: 100, y: 236, w: 1714, h: 764, name: props.zone, body: "panel-blue" });
        tl.from(zone.g, { scale: 0.92, opacity: 0, svgOrigin: "957 618", duration: 0.6, ease: "back.out(1.4)" }, 0.1);
        svg("rect", { x: 130, y: 860, width: 340, height: 24, rx: 12, class: "face-paper" }, cartonLayer);
        const carton = nv.carton(cartonLayer, 300, 860, 1.2);
        const badge = nv.pill(cartonLayer, "25 °C", 300, 390, 200, 80, { rot: -4, tone: "warm", size: 48 });
        tl.from(carton, { y: -100, opacity: 0, duration: 0.5, ease: "back.out(1.4)" }, 0.5);
        tl.from(badge.g, { scale: 0.6, opacity: 0, svgOrigin: "300 390", duration: 0.4, ease: "back.out(1.6)" }, 0.8);
        const spark = nv.sparkle(stage, 1730, 880, 42);
        tl.from(spark, { scale: 0.5, opacity: 0, svgOrigin: "1730 880", duration: 0.5, ease: "back.out(1.6)" }, 0.9);

        // Droplets sit along the coil; the ones past `boil` also get a bubble that replaces them in step 3.
        const spots = [];
        for (let s = 40; s < coil.length; s += GAP) spots.push({ s, ...coil.pointAt(s), upper: s > coil.marks.boil });
        const droplets = spots.map((p) => svg("circle", { cx: p.x, cy: p.y, r: 13, class: "face-blue" }, dotLayer));
        const bubbles = spots.filter((p) => p.upper).map((p) => ({ p, node: svg("circle", { cx: p.x, cy: p.y, r: 23, class: "face-paper" }, dotLayer) }));
        const upperDroplets = droplets.filter((_, i) => spots[i].upper);

        // bobina: the coil draws itself from the bottom; blue droplets pop in along it
        let at = tl.duration();
        const tube = nv.tube(tubeLayers, coil.d(), TUBE);
        tl.from(tube, { drawSVG: 0, duration: 1.4, ease: "power2.inOut" }, at);
        droplets.forEach((node, i) => {
          const p = spots[i];
          tl.from(node, { scale: 0, opacity: 0, svgOrigin: `${p.x} ${p.y}`, duration: 0.3, ease: "back.out(2)" }, at + 0.5 + i * 0.04);
        });
        writeIn(tl, nv.label(labelLayer, props.cold, 830, 925, "t56b"), at + 1.2, 0.6);
        tl.addLabel("bobina");

        // calor: three orange arrows from the carton to the coil
        at = tl.duration();
        const tails = [[450, 570], [450, 670], [450, 770]];
        const tips = [[665, 450], [665, 650], [665, 800]];
        tails.forEach(([x, y], i) => {
          const arrow = nv.arrow(arrowLayer, { x, y }, { x: tips[i][0], y: tips[i][1] }, { tone: "warm", w: 18 });
          tl.from(arrow, { scale: 0.05, opacity: 0, svgOrigin: `${x} ${y}`, duration: 0.7, ease: "expo.out" }, at + i * 0.18);
        });
        tl.addLabel("calor");

        // hierve: in the upper turns the droplets grow into white bubbles
        at = tl.duration();
        tl.to(upperDroplets, { scale: 0, opacity: 0, duration: 0.3, ease: "power3.in", stagger: 0.04 }, at);
        bubbles.forEach(({ p, node }, i) => {
          tl.from(node, { scale: 0, opacity: 0, svgOrigin: `${p.x} ${p.y}`, duration: 0.5, ease: "back.out(1.8)" }, at + 0.15 + i * 0.05);
        });
        const boil = nv.pill(labelLayer, props.boil, 1470, 720, 260, 84, { rot: 4, tone: "blue", size: 48 });
        tl.from(boil.g, { scale: 0.6, opacity: 0, svgOrigin: "1470 720", duration: 0.5, ease: "back.out(1.6)" }, at + 0.7);
        tl.addLabel("hierve");

        // gas: the exit tube draws to the right, full of bubbles, with its label
        at = tl.duration();
        const outTube = nv.tube(tubeLayers, exit.d(), TUBE);
        tl.from(outTube, { drawSVG: 0, duration: 0.9, ease: "power2.inOut" }, at);
        [91, 196, 301, 406].forEach((s, i) => {
          const p = exit.pointAt(s);
          const node = svg("circle", { cx: p.x, cy: p.y, r: 23, class: "face-paper" }, dotLayer);
          tl.from(node, { scale: 0, opacity: 0, svgOrigin: `${p.x} ${p.y}`, duration: 0.4, ease: "back.out(1.8)" }, at + 0.3 + i * 0.12);
        });
        props.gasLines.forEach((line, i) => writeIn(tl, nv.label(labelLayer, line, 1300, 500 + i * 65, "t56b"), at + 0.8 + i * 0.2, 0.6));
        tl.addLabel("gas");

        return tl;
      },
    });
  })();
</script>
