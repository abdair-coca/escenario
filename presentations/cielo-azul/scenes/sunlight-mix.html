<!--
  sunlight-mix: sunlight looks white, but it holds waves of every length. The beam comes first, then one
  dense blue wave (short) and one wide orange wave (long) inside it. The mascot looks up at the sun.
-->
<template>
  <style>
    .shade { fill: var(--ink); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
    .panel { fill: var(--paper); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
    .sun { fill: var(--paper); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
    .ink-line { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; }
    .warm-line { fill: none; stroke: var(--warm); stroke-linecap: round; stroke-linejoin: round; }
    .mascot { fill: var(--accent-2); stroke: var(--ink); stroke-width: 6; }
    .mascot-eye { fill: var(--paper); stroke: var(--ink); stroke-width: 4; }
    .pupil { fill: var(--ink); }
    .smile { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
    .cloud-ink { fill: var(--ink); stroke: var(--ink); stroke-width: 12; stroke-linejoin: round; }
    .cloud { fill: var(--paper); }
  </style>
</template>
<script src="/player/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="/library/shared/scene-kit.js"></script>
<script>
  (function () {
    const { svg, text, canvas, addStyles, writeIn, block } = window.sceneKit;

    // Hard shadow: a copy of the shape in ink, offset right and down, drawn first. Returns both parts.
    function sticker(parent, tag, attrs, cls, offset = 10) {
      const shade = svg(tag, { ...attrs, class: "shade", transform: `translate(${offset} ${offset})` }, parent);
      const body = svg(tag, { ...attrs, class: cls }, parent);
      return [shade, body];
    }

    function label(parent, content, x, y, cls = "t40", anchor = "start") {
      return text(parent, content, { class: cls, x, y, "text-anchor": anchor, "dominant-baseline": "central" });
    }

    // A polyline along `dir` from `origin`, swinging `amp` px across it (along `normal`) with the given period.
    function along(origin, dir, normal, from, to, amp, period) {
      let d = "";
      for (let t = from; t <= to; t += 4) {
        const swing = amp * Math.sin((2 * Math.PI * (t - from)) / period);
        const x = origin.x + t * dir.x + swing * normal.x;
        const y = origin.y + t * dir.y + swing * normal.y;
        d += `${d ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`;
      }
      return d;
    }

    // A wave: an ink outline under a coloured line.
    function wave(parent, d, color) {
      return [
        svg("path", { d, class: "ink-line", "stroke-width": 16 }, parent),
        svg("path", { d, class: `${color}-line`, "stroke-width": 8 }, parent),
      ];
    }

    // Merged cloud: every circle is outlined first, then all are filled, so only the outer ring stays ink.
    function cloud(parent, circles) {
      const g = svg("g", { "data-decor": "" }, parent);
      circles.forEach(([x, y, r]) => svg("circle", { cx: x + 10, cy: y + 10, r, class: "cloud-ink" }, g));
      circles.forEach(([x, y, r]) => svg("circle", { cx: x, cy: y, r, class: "cloud-ink" }, g));
      circles.forEach(([x, y, r]) => svg("circle", { cx: x, cy: y, r, class: "cloud" }, g));
      return g;
    }

    // Mascot: a round blob with big eyes that look along `look` (x, y) and a small smile.
    function mascot(parent, cx, cy, r, look) {
      const g = svg("g", { "data-decor": "" }, parent);
      svg("circle", { cx: cx + 10, cy: cy + 10, r, class: "shade" }, g);
      svg("circle", { cx, cy, r, class: "mascot" }, g);
      for (const side of [-1, 1]) {
        const ex = cx + side * 0.36 * r;
        const ey = cy - 0.18 * r;
        const er = 0.26 * r;
        svg("circle", { cx: ex, cy: ey, r: er, class: "mascot-eye" }, g);
        svg("circle", { cx: ex + look[0] * er * 0.45, cy: ey + look[1] * er * 0.45, r: er * 0.5, class: "pupil" }, g);
      }
      svg("path", { class: "smile", d: `M${cx - 0.3 * r},${cy + 0.28 * r} Q${cx},${cy + 0.56 * r} ${cx + 0.3 * r},${cy + 0.28 * r}` }, g);
      return g;
    }

    function starPoints(cx, cy, outer, inner, points) {
      const pts = [];
      for (let i = 0; i < points * 2; i += 1) {
        const r = i % 2 === 0 ? outer : inner;
        const a = (Math.PI * i) / points - Math.PI / 2;
        pts.push(`${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`);
      }
      return pts.join(" ");
    }

    registerScene({
      id: "sunlight-mix",
      props: {
        headline: "¿Por qué el cielo es azul?", // headline, top left
      },
      steps: ["pregunta", "sol", "ondas"],
      build(root, props, gsap) {
        addStyles(root);
        const stage = canvas(root);
        const beamLayer = svg("g", {}, stage);
        const sunLayer = svg("g", {}, stage);
        const waveLayer = svg("g", {}, stage);
        const mascotLayer = svg("g", {}, stage);
        const cloudLayer = svg("g", {}, stage);
        const labelLayer = svg("g", {}, stage);
        const tl = gsap.timeline();

        // Entrance: the headline, the mascot looking up at the sun, one cloud in the top right corner.
        writeIn(tl, block(root, props.headline, { x: 160, y: 96, className: "t96" }), 0, 0.6);
        const mascotG = mascot(mascotLayer, 300, 830, 96, [0.6, -0.8]);
        tl.from(mascotG, { scale: 0.6, opacity: 0, svgOrigin: "300 830", duration: 0.6, ease: "back.out(1.6)" }, 0.2);
        const cloudG = cloud(cloudLayer, [[1690, 250, 40], [1740, 220, 56], [1790, 256, 44]]);
        tl.from(cloudG, { opacity: 0, duration: 0.6, ease: "power2.out" }, 0.4);
        tl.addLabel("pregunta");

        // sol: the sun and its white beam
        let at = tl.duration();
        const beam = sticker(beamLayer, "rect", { x: 350, y: 330, width: 1390, height: 360, rx: 40 }, "panel");
        const sun = sticker(sunLayer, "polygon", { points: starPoints(350, 510, 120, 88, 16) }, "sun");
        tl.from(beam, { opacity: 0, duration: 0.5, ease: "power2.out" }, at);
        tl.from(sun, { scale: 0.6, opacity: 0, svgOrigin: "350 510", duration: 0.6, ease: "back.out(1.6)" }, at + 0.2);
        writeIn(tl, label(labelLayer, "luz blanca", 520, 300), at + 0.7, 0.5);
        tl.addLabel("sol");

        // ondas: one blue wave and one orange wave inside the beam, with the colours in between
        at = tl.duration();
        const blueWave = wave(waveLayer, along({ x: 0, y: 425 }, { x: 1, y: 0 }, { x: 0, y: 1 }, 560, 1240, 18, 56), "blue");
        const warmWave = wave(waveLayer, along({ x: 0, y: 610 }, { x: 1, y: 0 }, { x: 0, y: 1 }, 560, 1240, 30, 200), "warm");
        tl.from(blueWave, { drawSVG: 0, duration: 1.1, ease: "power2.inOut" }, at);
        tl.from(warmWave, { drawSVG: 0, duration: 1.1, ease: "power2.inOut" }, at + 0.3);
        writeIn(tl, label(labelLayer, "onda corta: azul", 1290, 425), at + 0.9, 0.5);
        writeIn(tl, label(labelLayer, "y todos los colores", 1290, 490), at + 1.2, 0.5);
        writeIn(tl, label(labelLayer, "entre medias", 1290, 534), at + 1.3, 0.5);
        writeIn(tl, label(labelLayer, "onda larga: naranja", 1290, 610), at + 1.5, 0.5);
        tl.addLabel("ondas");

        return tl;
      },
    });
  })();
</script>
