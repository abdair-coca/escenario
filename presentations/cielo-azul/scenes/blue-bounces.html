<!--
  blue-bounces: one molecule. The orange wave (long) passes almost straight through; the blue wave (short)
  hits it and scatters in many directions. Two bars then compare the two: blue about 5 times orange.
-->
<template>
  <style>
    .shade { fill: var(--ink); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
    .blob { fill: var(--accent-2); stroke: var(--ink); stroke-width: 6; }
    .bar-blue { fill: var(--accent); stroke: var(--ink); stroke-width: 6; }
    .bar-warm { fill: var(--warm); stroke: var(--ink); stroke-width: 6; }
    .ink-line { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
    .blue-line { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; }
    .warm-line { fill: none; stroke: var(--warm); stroke-linecap: round; stroke-linejoin: round; }
    .blue-head { fill: var(--accent); stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
  </style>
</template>
<script src="/player/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="/library/shared/scene-kit.js"></script>
<script>
  (function () {
    const { svg, text, canvas, addStyles, writeIn, block } = window.sceneKit;

    // Hard shadow: a copy of the shape in ink, offset right and down, drawn first. Returns both parts.
    function sticker(parent, tag, attrs, cls, offset = 10) {
      const shade = svg(tag, { ...attrs, class: "shade", transform: `translate(${offset} ${offset})` }, parent);
      const body = svg(tag, { ...attrs, class: cls }, parent);
      return [shade, body];
    }

    function label(parent, content, x, y, cls = "t40", anchor = "start") {
      return text(parent, content, { class: cls, x, y, "text-anchor": anchor, "dominant-baseline": "central" });
    }

    // A polyline along `dir` from `origin`, swinging `amp` px across it (along `normal`) with the given period.
    function along(origin, dir, normal, from, to, amp, period) {
      let d = "";
      for (let t = from; t <= to; t += 4) {
        const swing = amp * Math.sin((2 * Math.PI * (t - from)) / period);
        const x = origin.x + t * dir.x + swing * normal.x;
        const y = origin.y + t * dir.y + swing * normal.y;
        d += `${d ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`;
      }
      return d;
    }

    // A wave: an ink outline under a coloured line.
    function wave(parent, d, color) {
      return [
        svg("path", { d, class: "ink-line", "stroke-width": 16 }, parent),
        svg("path", { d, class: `${color}-line`, "stroke-width": 8 }, parent),
      ];
    }

    // An arrow from p to q with a blue head and an ink outline.
    function arrow(parent, p, q) {
      const len = Math.hypot(q.x - p.x, q.y - p.y);
      const ux = (q.x - p.x) / len;
      const uy = (q.y - p.y) / len;
      const neck = { x: q.x - ux * 16, y: q.y - uy * 16 };
      const base = { x: q.x - ux * 24, y: q.y - uy * 24 };
      const head = `${q.x},${q.y} ${base.x - uy * 14},${base.y + ux * 14} ${base.x + uy * 14},${base.y - ux * 14}`;
      const line = { x1: p.x, y1: p.y, x2: neck.x, y2: neck.y };
      return [
        svg("line", { ...line, class: "ink-line", "stroke-width": 16 }, parent),
        svg("line", { ...line, class: "blue-line", "stroke-width": 8 }, parent),
        svg("polygon", { points: head, class: "blue-head" }, parent),
      ];
    }

    registerScene({
      id: "blue-bounces",
      props: {
        headline: "El azul rebota más", // headline, top left
      },
      steps: ["molecula", "naranja", "azul", "barras"],
      build(root, props, gsap) {
        addStyles(root);
        const stage = canvas(root);
        const waveLayer = svg("g", {}, stage);
        const moleculeLayer = svg("g", {}, stage);
        const scatterLayer = svg("g", { class: "scatter" }, stage);
        const barLayer = svg("g", {}, stage);
        const labelLayer = svg("g", {}, stage);
        const tl = gsap.timeline();
        const M = { x: 960, y: 470 }; // the molecule, in the centre

        // Entrance: the headline and the molecule (step 1).
        writeIn(tl, block(root, props.headline, { x: 160, y: 96, className: "t96" }), 0, 0.6);
        const molecule = sticker(moleculeLayer, "circle", { cx: M.x, cy: M.y, r: 92 }, "blob");
        tl.from(molecule, { scale: 0.6, opacity: 0, svgOrigin: `${M.x} ${M.y}`, duration: 0.6, ease: "back.out(1.6)" }, 0.2);
        tl.addLabel("molecula");

        // naranja: the long wave passes almost straight through the molecule
        let at = tl.duration();
        const orange = wave(waveLayer, along({ x: 160, y: 470 }, { x: 1, y: 0 }, { x: 0, y: 1 }, 0, 1640, 6, 220), "warm");
        tl.from(orange, { drawSVG: 0, duration: 1.2, ease: "power2.inOut" }, at);
        writeIn(tl, label(labelLayer, "naranja", 200, 420), at + 0.8, 0.5);
        tl.addLabel("naranja");

        // azul: the short wave hits the molecule and scatters in many directions
        at = tl.duration();
        const S = { x: 300, y: 250 };
        const dx = M.x - S.x;
        const dy = M.y - S.y;
        const L = Math.hypot(dx, dy);
        const dir = { x: dx / L, y: dy / L };
        const nrm = { x: -dir.y, y: dir.x };
        const blue = wave(waveLayer, along(S, dir, nrm, 0, L - 98, 14, 64), "blue");
        tl.from(blue, { drawSVG: 0, duration: 1.0, ease: "power2.inOut" }, at);
        writeIn(tl, label(labelLayer, "azul", 470, 262), at + 0.5, 0.5);
        const scatter = [-120, -75, -30, 30, 75, 120].flatMap((deg) => {
          const a = (deg * Math.PI) / 180;
          const from = { x: M.x + 108 * Math.cos(a), y: M.y + 108 * Math.sin(a) };
          const to = { x: M.x + 214 * Math.cos(a), y: M.y + 214 * Math.sin(a) };
          return arrow(scatterLayer, from, to);
        });
        tl.from(scatter, { opacity: 0, duration: 0.4, stagger: 0.05, ease: "expo.out" }, at + 0.9);
        tl.addLabel("azul");

        // barras: blue is about five times orange (approximate)
        at = tl.duration();
        const barBlue = sticker(barLayer, "rect", { x: 460, y: 760, width: 800, height: 56, rx: 12 }, "bar-blue");
        const barWarm = sticker(barLayer, "rect", { x: 460, y: 880, width: 160, height: 56, rx: 12 }, "bar-warm");
        tl.from(barBlue, { scaleX: 0, svgOrigin: "460 788", duration: 0.8, ease: "power2.out" }, at);
        tl.from(barWarm, { scaleX: 0, svgOrigin: "460 908", duration: 0.5, ease: "power2.out" }, at + 0.4);
        writeIn(tl, label(labelLayer, "azul", 200, 788), at + 0.6, 0.5);
        writeIn(tl, label(labelLayer, "naranja", 200, 908), at + 0.9, 0.5);
        writeIn(tl, label(labelLayer, "azul ≈ 5 × naranja (aprox.)", 460, 985), at + 1.2, 0.6);
        tl.addLabel("barras");

        return tl;
      },
    });
  })();
</script>
