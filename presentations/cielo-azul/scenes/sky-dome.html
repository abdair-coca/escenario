<!--
  sky-dome: the air is a dome over the mascot. Blue light arrives at its eyes from many points of the dome;
  the sun sits on the rim and its direct beam goes straight to the eyes without bouncing.
-->
<template>
  <style>
    .shade { fill: var(--ink); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
    .panel { fill: var(--paper); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
    .sun { fill: var(--paper); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
    .ink-line { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-linejoin: round; }
    .paper-line { fill: none; stroke: var(--paper); }
    .blue-line { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; }
    .blue-head { fill: var(--accent); stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
    .mascot { fill: var(--accent-2); stroke: var(--ink); stroke-width: 6; }
    .mascot-eye { fill: var(--paper); stroke: var(--ink); stroke-width: 4; }
    .pupil { fill: var(--ink); }
    .smile { fill: none; stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
    .cloud-ink { fill: var(--ink); stroke: var(--ink); stroke-width: 12; stroke-linejoin: round; }
    .cloud { fill: var(--paper); }
    .ground { fill: var(--accent-3); }
    .edge { fill: none; stroke: var(--ink); stroke-width: 6; }
  </style>
</template>
<script src="/player/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="/library/shared/scene-kit.js"></script>
<script>
  (function () {
    const { svg, text, canvas, addStyles, writeIn, block } = window.sceneKit;

    // Hard shadow: a copy of the shape in ink, offset right and down, drawn first. Returns both parts.
    function sticker(parent, tag, attrs, cls, offset = 10) {
      const shade = svg(tag, { ...attrs, class: "shade", transform: `translate(${offset} ${offset})` }, parent);
      const body = svg(tag, { ...attrs, class: cls }, parent);
      return [shade, body];
    }

    function label(parent, content, x, y, cls = "t40", anchor = "start") {
      return text(parent, content, { class: cls, x, y, "text-anchor": anchor, "dominant-baseline": "central" });
    }

    // An arrow from p to q with a blue head and an ink outline.
    function arrow(parent, p, q) {
      const len = Math.hypot(q.x - p.x, q.y - p.y);
      const ux = (q.x - p.x) / len;
      const uy = (q.y - p.y) / len;
      const neck = { x: q.x - ux * 16, y: q.y - uy * 16 };
      const base = { x: q.x - ux * 24, y: q.y - uy * 24 };
      const head = `${q.x},${q.y} ${base.x - uy * 14},${base.y + ux * 14} ${base.x + uy * 14},${base.y - ux * 14}`;
      const line = { x1: p.x, y1: p.y, x2: neck.x, y2: neck.y };
      return [
        svg("line", { ...line, class: "ink-line", "stroke-width": 16 }, parent),
        svg("line", { ...line, class: "blue-line", "stroke-width": 8 }, parent),
        svg("polygon", { points: head, class: "blue-head" }, parent),
      ];
    }

    // Merged cloud: every circle is outlined first, then all are filled, so only the outer ring stays ink.
    function cloud(parent, circles) {
      const g = svg("g", { "data-decor": "" }, parent);
      circles.forEach(([x, y, r]) => svg("circle", { cx: x + 10, cy: y + 10, r, class: "cloud-ink" }, g));
      circles.forEach(([x, y, r]) => svg("circle", { cx: x, cy: y, r, class: "cloud-ink" }, g));
      circles.forEach(([x, y, r]) => svg("circle", { cx: x, cy: y, r, class: "cloud" }, g));
      return g;
    }

    // Mascot: a round blob with big eyes that look along `look` (x, y) and a small smile.
    function mascot(parent, cx, cy, r, look) {
      const g = svg("g", { "data-decor": "" }, parent);
      svg("circle", { cx: cx + 10, cy: cy + 10, r, class: "shade" }, g);
      svg("circle", { cx, cy, r, class: "mascot" }, g);
      for (const side of [-1, 1]) {
        const ex = cx + side * 0.36 * r;
        const ey = cy - 0.18 * r;
        const er = 0.26 * r;
        svg("circle", { cx: ex, cy: ey, r: er, class: "mascot-eye" }, g);
        svg("circle", { cx: ex + look[0] * er * 0.45, cy: ey + look[1] * er * 0.45, r: er * 0.5, class: "pupil" }, g);
      }
      svg("path", { class: "smile", d: `M${cx - 0.3 * r},${cy + 0.28 * r} Q${cx},${cy + 0.56 * r} ${cx + 0.3 * r},${cy + 0.28 * r}` }, g);
      return g;
    }

    function starPoints(cx, cy, outer, inner, points) {
      const pts = [];
      for (let i = 0; i < points * 2; i += 1) {
        const r = i % 2 === 0 ? outer : inner;
        const a = (Math.PI * i) / points - Math.PI / 2;
        pts.push(`${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`);
      }
      return pts.join(" ");
    }

    registerScene({
      id: "sky-dome",
      props: {
        headline: "Azul desde todo el cielo", // headline, top left
      },
      steps: ["cupula", "azul", "sol"],
      build(root, props, gsap) {
        addStyles(root);
        const stage = canvas(root);
        const groundLayer = svg("g", {}, stage);
        const domeLayer = svg("g", {}, stage);
        const mascotLayer = svg("g", {}, stage);
        const arrowLayer = svg("g", {}, stage);
        const beamLayer = svg("g", {}, stage);
        const sunLayer = svg("g", {}, stage);
        const cloudLayer = svg("g", {}, stage);
        const labelLayer = svg("g", {}, stage);
        const tl = gsap.timeline();
        const C = { x: 960, y: 760 }; // centre of the dome's base
        const R = 520; // radius of the dome
        const EYES = { x: 960, y: 880 }; // midpoint between the mascot's eyes
        const SUN = { x: 1328, y: 392 }; // on the rim of the dome, 45 degrees up to the right

        // Entrance: the headline, the ground strip, the mascot under the dome and one cloud in the top left.
        writeIn(tl, block(root, props.headline, { x: 160, y: 96, className: "t96" }), 0, 0.6);
        const ground = [
          svg("rect", { x: 0, y: 972, width: 1920, height: 54, class: "ground", "data-decor": "" }, groundLayer),
          svg("line", { x1: 0, y1: 972, x2: 1920, y2: 972, class: "edge", "data-decor": "" }, groundLayer),
        ];
        tl.from(ground, { opacity: 0, duration: 0.5 }, 0.1);
        const mascotG = mascot(mascotLayer, 960, 894, 78, [0, -1]);
        tl.from(mascotG, { scale: 0.6, opacity: 0, svgOrigin: "960 894", duration: 0.6, ease: "back.out(1.6)" }, 0.3);
        const cloudG = cloud(cloudLayer, [[300, 330, 46], [352, 300, 62], [410, 336, 48]]);
        tl.from(cloudG, { opacity: 0, duration: 0.6, ease: "power2.out" }, 0.5);

        // cupula: the dome of air, labelled
        let at = tl.duration();
        const dome = sticker(domeLayer, "path", { d: `M${C.x - R},${C.y} A${R},${R} 0 0 1 ${C.x + R},${C.y} Z` }, "panel");
        tl.from(dome, { opacity: 0, duration: 0.6, ease: "power2.out" }, at);
        writeIn(tl, label(labelLayer, "aire", 500, 730), at + 0.5, 0.5);
        tl.addLabel("cupula");

        // azul: blue arrows reach the eyes from many points of the dome
        at = tl.duration();
        const arrows = [30, 65, 90, 115, 150].flatMap((deg) => {
          const a = (deg * Math.PI) / 180;
          const from = { x: C.x + 420 * Math.cos(a), y: C.y - 420 * Math.sin(a) };
          return arrow(arrowLayer, from, EYES);
        });
        tl.from(arrows, { opacity: 0, duration: 0.5, stagger: 0.12, ease: "expo.out" }, at);
        tl.addLabel("azul");

        // sol: the sun on the rim and its direct beam to the eyes
        at = tl.duration();
        const tube = [
          svg("line", { x1: SUN.x, y1: SUN.y, x2: EYES.x, y2: EYES.y, class: "ink-line", "stroke-width": 46 }, beamLayer),
          svg("line", { x1: SUN.x, y1: SUN.y, x2: EYES.x, y2: EYES.y, class: "paper-line", "stroke-width": 30 }, beamLayer),
        ];
        tl.from(tube, { drawSVG: 0, duration: 0.7, ease: "power2.inOut" }, at);
        const sun = sticker(sunLayer, "polygon", { points: starPoints(SUN.x, SUN.y, 80, 54, 16) }, "sun");
        tl.from(sun, { scale: 0.6, opacity: 0, svgOrigin: `${SUN.x} ${SUN.y}`, duration: 0.6, ease: "back.out(1.6)" }, at);
        writeIn(tl, label(labelLayer, "luz directa", 1430, SUN.y), at + 0.6, 0.5);
        tl.addLabel("sol");

        return tl;
      },
    });
  })();
</script>
