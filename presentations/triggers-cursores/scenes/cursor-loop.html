<!--
  cursor-loop — a cursor backfill, typed in and walked through: DECLARE and OPEN, FETCH into a variable,
  WHILE on @@FETCH_STATUS, one UPDATE per row, then CLOSE and DEALLOCATE. The diagram on the right is the
  loop itself. Its group is named `loop`, so the next scene can zoom into it.
-->
<template>
  <style>
    .box { fill: var(--paper); stroke: var(--ink); stroke-width: 4; }
    .box--block { stroke: var(--block); }
    .box-label { font-size: 40px; font-weight: 700; fill: var(--ink); }
    .box-label--block { fill: var(--block); }
    .arrow { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .arrow-head { fill: var(--ink); }
    .chip { font-family: var(--font-code); font-size: 40px; font-weight: 700; fill: var(--accent); letter-spacing: -0.03em; }
    .counter { font-size: 40px; font-weight: 700; fill: var(--block); }
    .muted { font-size: 40px; font-weight: 500; fill: var(--muted); }
    .bracket { fill: none; stroke: var(--accent); stroke-width: 5; }
    /* A pale highlight, so the violet keywords stay readable on it. */
    .code__bar { opacity: 0.25; }
  </style>
</template>
<script src="/player/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="/library/shared/scene-kit.js"></script>
<script src="/library/shared/code-panel.js"></script>
<script>
  (function () {
    const { svg, text, canvas, addStyles, writeIn, block } = window.sceneKit;
    const { codePanel } = window;
    const LINE = 40;
    const TOP = 230;
    const CODE = [
      "DECLARE @OrderId int;",
      "DECLARE c CURSOR LOCAL FAST_FORWARD FOR",
      "    SELECT OrderId FROM dbo.Orders;",
      "OPEN c;",
      "FETCH NEXT FROM c INTO @OrderId;",
      "WHILE @@FETCH_STATUS = 0",
      "BEGIN",
      "    UPDATE dbo.Orders",
      "    SET Total = (",
      "        SELECT ISNULL(SUM(Qty * UnitPrice), 0)",
      "        FROM dbo.OrderLines",
      "        WHERE OrderId = @OrderId",
      "    )",
      "    WHERE OrderId = @OrderId;",
      "    FETCH NEXT FROM c INTO @OrderId;",
      "END;",
      "CLOSE c;",
      "DEALLOCATE c;",
    ];

    registerScene({
      id: "cursor-loop",
      props: {},
      steps: ["declare", "fetch", "loop", "body", "close"],
      build(root, props, gsap) {
        addStyles(root);
        addStyles(root, codePanel.CSS);
        const stage = canvas(root);
        const code = codePanel.render(root, CODE, { x: 160, y: TOP, lang: "sql", lineHeight: LINE, numbers: 1 });
        const tl = gsap.timeline();
        writeIn(tl, block(root, "El cursor, fila a fila", { x: 160, y: 96, className: "t96" }), 0, 0.6);

        // The loop diagram: FETCH, then UPDATE, then back to FETCH
        const chip = text(stage, "@OrderId = 1042", { class: "chip", x: 1380, y: 290, "dominant-baseline": "central" });
        const fetchBox = [
          svg("rect", { class: "box", x: 1380, y: 330, width: 340, height: 80, rx: 10 }, stage),
          text(stage, "FETCH", { class: "box-label", x: 1550, y: 370, "text-anchor": "middle", "dominant-baseline": "central" }),
        ];
        const loop = svg("g", { class: "loop" }, stage);
        const updateBox = svg("rect", { class: "box box--block", x: 1380, y: 560, width: 340, height: 80, rx: 10 }, loop);
        text(loop, "UPDATE", { class: "box-label box-label--block", x: 1550, y: 600, "text-anchor": "middle", "dominant-baseline": "central" });
        const down = svg("path", { class: "arrow", d: "M1550,410 V548" }, loop);
        const downHead = svg("path", { class: "arrow-head", d: "M1550,560 L1534,530 L1566,530 Z" }, loop);
        const back = svg("path", { class: "arrow", d: "M1720,600 H1790 V370 H1720" }, loop);
        const backHead = svg("path", { class: "arrow-head", d: "M1720,370 L1748,354 L1748,386 Z" }, loop);
        const counter = [
          text(stage, "1 UPDATE", { class: "counter", x: 1380, y: 720, "dominant-baseline": "central" }),
          text(stage, "por pedido", { class: "muted", x: 1380, y: 770, "dominant-baseline": "central" }),
        ];

        // Highlights, one block at a time
        const bars = {
          declare: code.bar([0, 1, 2]),
          fetch: code.bar([3, 4]),
          loopHead: code.bar([5]),
          loopEnd: code.bar([14, 15]),
          body: code.bar([7, 8, 9, 10, 11, 12, 13]),
          close: code.bar([16, 17]),
        };

        // declare: the first step is the starting picture
        codePanel.typeIn(tl, code.lineEls, 0.4, { perChar: 0.004 });
        let at = tl.duration();
        codePanel.swipeIn(tl, bars.declare, at);
        tl.addLabel("declare");

        // fetch: OPEN and the first FETCH put a row into @OrderId
        at = tl.duration();
        codePanel.swipeOut(tl, bars.declare, at);
        codePanel.swipeIn(tl, bars.fetch, at + 0.15);
        tl.from(fetchBox, { opacity: 0, duration: 0.4, ease: "power2.out" }, at + 0.2);
        writeIn(tl, chip, at + 0.5, 0.45);
        tl.addLabel("fetch");

        // loop: WHILE checks the status; the loop closes back to FETCH
        at = tl.duration();
        codePanel.swipeOut(tl, bars.fetch, at);
        codePanel.swipeIn(tl, bars.loopHead, at + 0.15);
        codePanel.swipeIn(tl, bars.loopEnd, at + 0.15);
        tl.from(loop, { opacity: 0, duration: 0.4, ease: "power2.out" }, at + 0.2);
        tl.from(down, { drawSVG: 0, duration: 0.4, ease: "power2.inOut" }, at + 0.3);
        tl.from(downHead, { opacity: 0, duration: 0.25, ease: "power2.out" }, at + 0.6);
        tl.from(back, { drawSVG: 0, duration: 0.5, ease: "power2.inOut" }, at + 0.5);
        tl.from(backHead, { opacity: 0, duration: 0.25, ease: "power2.out" }, at + 0.9);
        tl.addLabel("loop");

        // body: one UPDATE per row
        at = tl.duration();
        codePanel.swipeOut(tl, bars.loopHead, at);
        codePanel.swipeOut(tl, bars.loopEnd, at);
        codePanel.swipeIn(tl, bars.body, at + 0.15);
        writeIn(tl, counter[0], at + 0.3, 0.4);
        writeIn(tl, counter[1], at + 0.5, 0.4);
        tl.addLabel("body");

        // close: CLOSE and DEALLOCATE
        at = tl.duration();
        codePanel.swipeOut(tl, bars.body, at);
        codePanel.swipeIn(tl, bars.close, at + 0.15);
        tl.addLabel("close");
        return tl;
      },
    });
  })();
</script>
