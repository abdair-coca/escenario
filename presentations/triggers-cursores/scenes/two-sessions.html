<!--
  two-sessions — two sessions add a line to the same order at the same time. Each reads the total,
  adds its line, and writes the result. Under RCSI, session B reads 30 before session A commits, so the
  last write (30) drops A's line; the correct total is 36. The fix: lock the order row before the read,
  or add the difference with one atomic UPDATE. Timing and numbers were checked on SQL Server 2022.
-->
<template>
  <style>
    .panel { fill: var(--paper); stroke: var(--ink); stroke-width: 4; }
    .panel-head { fill: var(--header); }
    .lane-a { font-size: 40px; font-weight: 700; fill: var(--accent); }
    .lane-b { font-size: 40px; font-weight: 700; fill: var(--accent-2); }
    .step { fill: var(--paper); stroke-width: 4; }
    .step--a { stroke: var(--accent); }
    .step--b { stroke: var(--accent-2); }
    .step--block { stroke: var(--block); }
    .step-text { font-family: var(--font-code); font-size: 40px; fill: var(--ink); letter-spacing: -0.03em; }
    .step-text--block { fill: var(--block); font-weight: 700; }
    .muted { font-size: 40px; font-weight: 500; fill: var(--muted); }
    .label { font-size: 40px; font-weight: 500; fill: var(--muted); }
    .value { font-size: 200px; font-weight: 700; fill: var(--ink); letter-spacing: -0.02em; }
    .value--block { fill: var(--block); }
    .value--ok { fill: var(--ok); }
    .expected { font-size: 40px; font-weight: 700; fill: var(--block); }
    .fix { fill: var(--paper); stroke: var(--ok); stroke-width: 6; }
    .fix-text { font-size: 40px; font-weight: 700; fill: var(--ok); }
    .fix-body { font-size: 40px; font-weight: 500; fill: var(--ink); }
  </style>
</template>
<script src="/player/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="/library/shared/scene-kit.js"></script>
<script>
  (function () {
    const { svg, text, canvas, addStyles, writeIn, block } = window.sceneKit;
    const CENTER = { "dominant-baseline": "central" };

    registerScene({
      id: "two-sessions",
      props: {},
      steps: ["start", "a", "b", "lost", "fix"],
      build(root, props, gsap) {
        addStyles(root);
        const stage = canvas(root);
        const tl = gsap.timeline();
        writeIn(tl, block(root, "Dos sesiones a la vez", { x: 160, y: 96, className: "t96" }), 0, 0.6);

        // Lane A: a Croissant (+6). Lane B: a Té (+4). Both read the total before they write.
        const laneA = text(stage, "Sesión A · INSERT Croissant (+6)", { class: "lane-a", x: 160, y: 310, ...CENTER });
        const a1 = [svg("rect", { class: "step step--a", x: 160, y: 340, width: 500, height: 90, rx: 10 }, stage), text(stage, "lee: 26 + 6 = 32", { class: "step-text", x: 410, y: 385, "text-anchor": "middle", ...CENTER })];
        const a2 = [svg("rect", { class: "step step--a", x: 700, y: 340, width: 300, height: 90, rx: 10 }, stage), text(stage, "escribe 32", { class: "step-text", x: 850, y: 385, "text-anchor": "middle", ...CENTER })];
        const aNote = text(stage, "sin confirmar", { class: "muted", x: 850, y: 462, "text-anchor": "middle", ...CENTER });
        const laneB = text(stage, "Sesión B · INSERT Té (+4)", { class: "lane-b", x: 160, y: 530, ...CENTER });
        const b1 = [svg("rect", { class: "step step--b", x: 160, y: 560, width: 500, height: 90, rx: 10 }, stage), text(stage, "lee: 26 + 4 = 30", { class: "step-text", x: 410, y: 605, "text-anchor": "middle", ...CENTER })];
        const bNote = text(stage, "B no ve la línea de A", { class: "muted", x: 160, y: 690, ...CENTER });
        const b2 = [svg("rect", { class: "step step--block", x: 700, y: 560, width: 300, height: 90, rx: 10 }, stage), text(stage, "escribe 30", { class: "step-text step-text--block", x: 850, y: 605, "text-anchor": "middle", ...CENTER })];
        const committed = text(stage, "A confirmó", { class: "muted", x: 850, y: 462, "text-anchor": "middle", ...CENTER });

        // The shared total
        const panel = svg("rect", { class: "panel", x: 1100, y: 300, width: 660, height: 380, rx: 14 }, stage);
        const totalLabel = text(stage, "Orders.Total", { class: "label", x: 1140, y: 350, ...CENTER });
        const values = [
          text(stage, "26", { class: "value", x: 1140, y: 520, ...CENTER }),
          text(stage, "32", { class: "value", x: 1140, y: 520, ...CENTER }),
          text(stage, "30", { class: "value value--block", x: 1140, y: 520, ...CENTER }),
          text(stage, "36", { class: "value value--ok", x: 1140, y: 520, ...CENTER }),
        ];
        const expected = text(stage, "debería ser 36", { class: "expected", x: 1140, y: 640, ...CENTER });

        // The fix
        const fixBox = svg("rect", { class: "fix", x: 160, y: 760, width: 1600, height: 150, rx: 14 }, stage);
        const fixTitle = text(stage, "Bloquea el pedido antes de recalcular (UPDLOCK),", { class: "fix-text", x: 200, y: 815, ...CENTER });
        const fixBody = text(stage, "o aplica la diferencia: SET Total = Total + 4.", { class: "fix-body", x: 200, y: 865, ...CENTER });

        // Hidden until their step: lane A's writes come in at "a", and so on
        tl.set([...a1, ...a2, aNote, ...b1, bNote, ...b2, committed, expected, ...values.slice(1), fixBox, fixTitle, fixBody], { opacity: 0 }, 0);

        // start: both lanes start from 26
        tl.from([panel, totalLabel, laneA, laneB, values[0]], { opacity: 0, duration: 0.4, ease: "power2.out" }, 0.2);
        tl.addLabel("start");

        // a: A reads 26, adds 6 and writes 32, which is not committed yet
        let at = tl.duration();
        tl.to([...a1, ...a2], { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.2 }, at);
        tl.to(aNote, { opacity: 1, duration: 0.3, ease: "power2.out" }, at + 0.6);
        tl.to(values[0], { opacity: 0, duration: 0.25, ease: "power3.in" }, at + 0.6);
        tl.to(values[1], { opacity: 1, duration: 0.3, ease: "power2.out" }, at + 0.8);
        tl.addLabel("a");

        // b: B reads 26 and adds 4 before A commits, so it reads 30
        at = tl.duration();
        tl.to([...b1], { opacity: 1, duration: 0.4, ease: "power2.out" }, at);
        tl.to(bNote, { opacity: 1, duration: 0.3, ease: "power2.out" }, at + 0.4);
        tl.addLabel("b");

        // lost: A commits; B writes 30 over 32, and A's line is gone from the total
        at = tl.duration();
        tl.to(aNote, { opacity: 0, duration: 0.25, ease: "power3.in" }, at);
        tl.to(committed, { opacity: 1, duration: 0.3, ease: "power2.out" }, at);
        tl.to(b2, { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.2 }, at + 0.4);
        tl.to(values[1], { opacity: 0, duration: 0.25, ease: "power3.in" }, at + 0.8);
        tl.to(values[2], { opacity: 1, duration: 0.3, ease: "power2.out" }, at + 0.9);
        tl.to(expected, { opacity: 1, duration: 0.3, ease: "power2.out" }, at + 1.1);
        tl.addLabel("lost");

        // fix: lock first, then recalculate; the total is 36
        at = tl.duration();
        tl.to([expected, values[2]], { opacity: 0, duration: 0.25, ease: "power3.in" }, at);
        tl.to(values[3], { opacity: 1, duration: 0.3, ease: "power2.out" }, at + 0.2);
        tl.to([fixBox, fixTitle, fixBody], { opacity: 1, duration: 0.4, ease: "power2.out" }, at + 0.2);
        tl.addLabel("fix");
        return tl;
      },
    });
  })();
</script>
