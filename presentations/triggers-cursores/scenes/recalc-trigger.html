<!--
  recalc-trigger — the trigger's T-SQL, typed in line by line. The affected orders come from both
  pseudo-tables (inserted and deleted); each one is recalculated with one UPDATE, not one per row.
  Brackets on the right name the block that is active.
-->
<template>
  <style>
    .bracket { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .note-text { font-size: 40px; font-weight: 500; fill: var(--ink); }
    .note-result { font-size: 40px; font-weight: 700; fill: var(--accent); }
    /* A pale highlight, so the violet keywords stay readable on it. */
    .code__bar { opacity: 0.25; }
  </style>
</template>
<script src="/library/shared/scene-kit.js"></script>
<script src="/library/shared/code-panel.js"></script>
<script>
  (function () {
    const { svg, text, canvas, addStyles, writeIn, block } = window.sceneKit;
    const { codePanel } = window;
    const LINE = 40;
    const TOP = 214;
    const CODE = [
      "CREATE OR ALTER TRIGGER dbo.trg_OrderLines_RecalcTotal",
      "ON dbo.OrderLines AFTER INSERT, UPDATE, DELETE",
      "AS",
      "BEGIN",
      "    SET NOCOUNT ON;",
      "    WITH affected AS (",
      "        -- pedidos tocados por la sentencia",
      "        SELECT OrderId FROM inserted",
      "        UNION",
      "        SELECT OrderId FROM deleted",
      "    )",
      "    UPDATE o",
      "    SET o.Total = (",
      "        SELECT ISNULL(SUM(l.Qty * l.UnitPrice), 0)",
      "        FROM dbo.OrderLines AS l",
      "        WHERE l.OrderId = o.OrderId",
      "    )",
      "    FROM dbo.Orders AS o",
      "    WHERE o.OrderId IN (SELECT OrderId FROM affected);",
      "END;",
    ];

    registerScene({
      id: "recalc-trigger",
      props: {},
      steps: ["affected", "sum", "update", "result"],
      build(root, props, gsap) {
        addStyles(root);
        addStyles(root, codePanel.CSS);
        const stage = canvas(root);
        const code = codePanel.render(root, CODE, { x: 160, y: TOP, lang: "sql", lineHeight: LINE, numbers: 1, className: "trigger-code" });
        const tl = gsap.timeline();
        writeIn(tl, block(root, "El trigger de recálculo", { x: 160, y: 96, className: "t96" }), 0, 0.6);

        // A bracket on the right of lines [from..to], with its words beside it.
        const note = (from, to, lines, result = false) => {
          const first = code.spanBox(from, 0, 1);
          const last = code.spanBox(to, 0, 1);
          const top = first.y + 6;
          const bottom = last.y + last.height - 6;
          const g = svg("g", { class: "note" }, stage);
          const bracket = svg("path", { class: "bracket", d: `M1500,${top} H1512 V${bottom} H1500` }, g);
          const middle = (top + bottom) / 2;
          const texts = lines.map((line, i) =>
            text(g, line, { class: result ? "note-result" : "note-text", x: 1530, y: middle + (i - (lines.length - 1) / 2) * 46, "dominant-baseline": "central" }));
          return { g, bracket, texts };
        };
        const enter = (item, at) => {
          tl.from(item.g, { opacity: 0, duration: 0.3, ease: "power2.out" }, at);
          tl.from(item.bracket, { drawSVG: 0, duration: 0.4, ease: "power2.inOut" }, at);
          item.texts.forEach((t, i) => writeIn(tl, t, at + 0.2 + i * 0.12, 0.4));
        };
        const exit = (item, at) => tl.to(item.g, { opacity: 0, duration: 0.25, ease: "power3.in" }, at);

        const barAffected = code.bar([5, 6, 7, 8, 9, 10]);
        const barSum = code.bar([12, 13, 14, 15, 16]);
        const barUpdate = [code.bar([11]), code.bar([17, 18])];
        const affectedNote = note(5, 10, ["afectados:", "{1042}"]);
        const sumNote = note(12, 16, ["recalcula", "cada pedido"]);
        const updateNote = note(17, 18, ["un UPDATE", "para todos"]);
        const resultNote = note(11, 18, ["Total = 32"], true);

        // affected: the code is typed in; the first step is the starting picture
        codePanel.typeIn(tl, code.lineEls, 0.4, { perChar: 0.004 });
        let at = tl.duration();
        codePanel.swipeIn(tl, barAffected, at);
        enter(affectedNote, at + 0.2);
        tl.addLabel("affected");

        // sum: the correlated SUM for each affected order
        at = tl.duration();
        codePanel.swipeOut(tl, barAffected, at);
        exit(affectedNote, at);
        codePanel.swipeIn(tl, barSum, at + 0.15);
        enter(sumNote, at + 0.35);
        tl.addLabel("sum");

        // update: one UPDATE for all of them
        at = tl.duration();
        codePanel.swipeOut(tl, barSum, at);
        exit(sumNote, at);
        barUpdate.forEach((bar) => codePanel.swipeIn(tl, bar, at + 0.15));
        enter(updateNote, at + 0.35);
        tl.addLabel("update");

        // result: the total after the INSERT of Croissant
        at = tl.duration();
        barUpdate.forEach((bar) => codePanel.swipeOut(tl, bar, at));
        exit(updateNote, at);
        enter(resultNote, at + 0.2);
        tl.addLabel("result");
        return tl;
      },
    });
  })();
</script>
