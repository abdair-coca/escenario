<!--
  clocks: a tiny clock error is a huge distance error. Left column: a stopwatch at 0,001 s means 300 km; the
  satellite carries an atomic clock; the phone has a cheap one. Right: the three rings of three-circles, small,
  first meeting at the blue dot; with the clock error they all grow and miss each other. Satellite #4 adds a ring,
  and shrinking all four rings by the same amount makes them meet again. The phone screen (class phone-screen)
  is where the next scene zooms in.
-->
<template>
  <style>
    .watch-text { font-weight: 700; fill: var(--ink); }
    .tick { fill: none; stroke: var(--paper); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .leader { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
  </style>
</template>
<script src="/player/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="/library/shared/scene-kit.js"></script>
<script src="/library/shared/sticker-kit.js"></script>
<script src="kit.js"></script>
<script>
  (function () {
    const { svg, text, canvas, writeIn, block } = window.sceneKit;
    const sk = window.stickerKit;
    const gps = window.gps;

    // The right diagram is the map geometry shrunk around its centre; ERROR is the clock error as extra radius.
    const SCALE = 0.7;
    const FROM = { x: 954, y: 570 };
    const TO = { x: 1390, y: 640 };
    const ERROR = 70;
    const T = (p) => ({ x: TO.x + (p.x - FROM.x) * SCALE, y: TO.y + (p.y - FROM.y) * SCALE });

    registerScene({
      id: "clocks",
      props: {
        headline: "Relojes que no pueden fallar", // headline, top left
        tiny: "0,001 s", // clock error on the stopwatch
        huge: "300 km", // distance error it causes
        miss: "no se cruzan", // tag on the rings that miss
        atomic: "reloj atómico", // pill next to the satellite
        cheap: "reloj barato ?", // tag next to the phone
      },
      steps: ["error", "atomico", "cuarto"],
      build(root, props, gsap) {
        gps.setup(root);
        const stage = canvas(root);
        const ringLayer = svg("g", {}, stage);
        const satLayer = svg("g", {}, stage);
        const dotLayer = svg("g", {}, stage);
        const leftLayer = svg("g", {}, stage);
        const tagLayer = svg("g", {}, stage);
        const tl = gsap.timeline();
        const P = T(gps.P);

        // Entrance: the headline and the three rings meeting at the blue dot, as at the end of three-circles.
        writeIn(tl, block(root, props.headline, { x: 160, y: 96, className: "t96" }), 0, 0.7);
        const rings = {};
        for (const n of [1, 2, 3, 4]) {
          const c = T(gps.SATS[n]);
          rings[n] = gps.ring(ringLayer, c, gps.radius(n) * SCALE, n === 4);
          if (n < 4) {
            const sat = gps.satellite(satLayer, c.x, c.y, 0.45, n);
            tl.from([rings[n], sat.g], { opacity: 0, duration: 0.4, ease: "power2.out" }, 0.2 + n * 0.1);
          }
        }
        const dot = gps.blueDot(dotLayer, P.x, P.y, 20);
        tl.from(dot, { scale: 0.2, opacity: 0, svgOrigin: `${P.x} ${P.y}`, duration: 0.4, ease: "back.out(2)" }, 0.6);
        // every ring's radius is its true distance plus the clock error `e`, a pure function of the tween
        const error = { e: 0 };
        const size = () => {
          for (const n of [1, 2, 3, 4]) rings[n].setAttribute("r", ((gps.radius(n) + error.e) * SCALE).toFixed(1));
        };

        // error: stopwatch, arrow and «300 km»; the rings grow by the error and no longer meet
        let at = tl.duration();
        const watch = svg("g", {}, leftLayer);
        sk.sticker(watch, "rect", { x: 240, y: 248, width: 40, height: 34, rx: 8 }, "face-navy", 6);
        sk.sticker(watch, "circle", { cx: 260, cy: 390, r: 112 }, "panel", 10);
        text(watch, props.tiny, { x: 260, y: 392, class: "watch-text", "text-anchor": "middle", "dominant-baseline": "central", style: "font-size:48px" });
        tl.from(watch, { scale: 0.6, opacity: 0, svgOrigin: "260 390", duration: 0.5, ease: "back.out(1.6)" }, at);
        const arrow = sk.arrow(leftLayer, { x: 392, y: 390 }, { x: 520, y: 390 }, { tone: "ink", w: 12 });
        tl.from(arrow, { scale: 0.1, opacity: 0, svgOrigin: "392 390", duration: 0.4, ease: "expo.out" }, at + 0.35);
        const huge = sk.stickerText(leftLayer, props.huge, 550, 390, 96, { anchor: "start", tone: "blue" });
        tl.from(huge, { scale: 0.6, opacity: 0, svgOrigin: "550 390", duration: 0.5, ease: "back.out(1.6)" }, at + 0.6);
        tl.to(dot, { scale: 0.2, opacity: 0, svgOrigin: `${P.x} ${P.y}`, duration: 0.3, ease: "power3.in" }, at + 1.0);
        tl.to(error, { e: ERROR, duration: 0.9, ease: "power2.inOut", onUpdate: size }, at + 1.1);
        const missAt = { x: P.x - 120, y: 960 };
        const leader = svg("line", { x1: missAt.x + 40, y1: missAt.y - 34, x2: P.x - 6, y2: P.y + 36, class: "leader" }, tagLayer);
        const miss = gps.tag(tagLayer, props.miss, missAt.x, missAt.y, { size: 40, rot: -3 });
        tl.from([leader, miss], { opacity: 0, duration: 0.35, ease: "power2.out" }, at + 1.9);
        tl.addLabel("error");

        // atomico: the satellite, with an atomic clock and a tick
        at = tl.duration();
        const sat = gps.satellite(leftLayer, 250, 640, 0.75);
        tl.from(sat.g, { scale: 0.6, opacity: 0, svgOrigin: "250 640", duration: 0.5, ease: "back.out(1.6)" }, at);
        const atomic = sk.pill(leftLayer, props.atomic, 600, 640, 400, 92, { rot: -3, tone: "navy", size: 48 });
        tl.from(atomic.g, { scale: 0.6, opacity: 0, svgOrigin: "600 640", duration: 0.45, ease: "back.out(1.6)" }, at + 0.3);
        const tick = svg("g", {}, leftLayer);
        sk.sticker(tick, "circle", { cx: 852, cy: 626, r: 40 }, "face-ok", 6);
        svg("path", { d: "M832,628 L847,644 L873,610", class: "tick" }, tick);
        tl.from(tick, { scale: 0.3, opacity: 0, svgOrigin: "852 626", duration: 0.4, ease: "back.out(2)" }, at + 0.6);
        tl.addLabel("atomico");

        // cuarto: the phone and its cheap clock; satellite #4 adds a ring, all rings shrink together and meet
        at = tl.duration();
        const phone = gps.phone(leftLayer, 250, 880, 104, 170);
        tl.from(phone.g, { scale: 0.6, opacity: 0, svgOrigin: "250 880", duration: 0.5, ease: "back.out(1.6)" }, at);
        const cheap = gps.tag(leftLayer, props.cheap, 560, 880, { size: 44, rot: 2 });
        tl.from(cheap, { scale: 0.6, opacity: 0, svgOrigin: "560 880", duration: 0.45, ease: "back.out(1.6)" }, at + 0.3);
        const c4 = T(gps.SATS[4]);
        const sat4 = gps.satellite(satLayer, c4.x, c4.y, 0.45, 4);
        tl.from(sat4.g, { scale: 0.6, opacity: 0, svgOrigin: `${c4.x} ${c4.y}`, duration: 0.5, ease: "back.out(1.6)" }, at + 0.7);
        // a scale pop, not drawSVG: the ring's length changes while it grows and shrinks
        const ring4 = svg("g", {}, ringLayer);
        ring4.append(rings[4]);
        tl.from(ring4, { scale: 0.1, opacity: 0, svgOrigin: `${c4.x} ${c4.y}`, duration: 0.8, ease: "expo.out" }, at + 0.9);
        tl.to([leader, miss], { opacity: 0, duration: 0.25, ease: "power3.in" }, at + 1.8);
        tl.to(error, { e: 0, duration: 1.0, ease: "power2.inOut", onUpdate: size }, at + 1.9);
        tl.to(dot, { scale: 1, opacity: 1, svgOrigin: `${P.x} ${P.y}`, duration: 0.45, ease: "back.out(2)" }, at + 2.9);
        tl.addLabel("cuarto");

        return tl;
      },
    });
  })();
</script>
