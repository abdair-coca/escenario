<!--
  time-message: the delay of a message tells the distance. On the left, a storm panel: a lightning bolt, a counter
  that reaches 3 s and «≈ 1 km». On the right, satellite #1 sends a bubble with its name and the exact time down a
  dotted path to the phone; it arrives 0,07 s later, which means about 21 000 km. The big «21 000 km» sticker
  (class `distance`) is where the next scene grows from.
-->
<template>
  <style>
    .bubble-text { font-weight: 700; fill: var(--ink); }
  </style>
</template>
<script src="/player/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="/library/shared/scene-kit.js"></script>
<script src="/library/shared/sticker-kit.js"></script>
<script src="kit.js"></script>
<script>
  (function () {
    const { svg, text, canvas, writeIn, block } = window.sceneKit;
    const sk = window.stickerKit;
    const gps = window.gps;

    registerScene({
      id: "time-message",
      props: {
        headline: "Un mensaje con la hora", // headline, top left
        storm: "Rayo y trueno", // title band of the storm panel
        seconds: 3, // seconds counted between lightning and thunder
        stormDistance: "≈ 1 km", // what those seconds mean
        bubble: ["Soy el #1", "son las 12:00:00,000"], // the satellite's message, two lines
        arrival: "llegó a las 12:00:00,070", // phone clock when the message arrives
        delay: "tardó 0,07 s", // the travel time
        distance: "21 000 km", // the distance it means
      },
      steps: ["trueno", "mensaje", "llega"],
      build(root, props, gsap) {
        gps.setup(root);
        const stage = canvas(root);
        const decorLayer = svg("g", {}, stage);
        const panelLayer = svg("g", {}, stage);
        const pathLayer = svg("g", {}, stage);
        const thingLayer = svg("g", {}, stage);
        const bubbleLayer = svg("g", {}, stage);
        const resultLayer = svg("g", {}, stage);
        const tl = gsap.timeline();
        const SAT = { x: 1420, y: 330 };
        const PHONE = { x: 1420, y: 860, w: 150, h: 250 };
        const pathTop = { x: SAT.x, y: SAT.y + 80 };
        const pathEnd = { x: PHONE.x, y: PHONE.y - PHONE.h / 2 - 14 };

        // Entrance: headline, two sparkles, satellite #1, the phone and the dotted path between them.
        writeIn(tl, block(root, props.headline, { x: 160, y: 96, className: "t96" }), 0, 0.7);
        const sparkles = [sk.sparkle(decorLayer, 1800, 120, 30), sk.sparkle(decorLayer, 1650, 84, 20)];
        tl.from(sparkles, { scale: 0.3, opacity: 0, transformOrigin: "50% 50%", duration: 0.4, ease: "back.out(2)", stagger: 0.1 }, 0.2);
        const sat = gps.satellite(thingLayer, SAT.x, SAT.y, 1, 1);
        tl.from(sat.g, { y: -80, opacity: 0, duration: 0.6, ease: "expo.out" }, 0.2);
        const phone = gps.phone(thingLayer, PHONE.x, PHONE.y, PHONE.w, PHONE.h);
        tl.from(phone.g, { y: 60, opacity: 0, duration: 0.6, ease: "expo.out" }, 0.3);
        const path = svg("line", { x1: pathTop.x, y1: pathTop.y, x2: pathEnd.x, y2: pathEnd.y, class: "signal" }, pathLayer);
        tl.from(path, { opacity: 0, duration: 0.4 }, 0.6);

        // trueno: the storm panel, the bolt, a counter up to 3 s, then «≈ 1 km»
        let at = tl.duration();
        const panel = svg("g", {}, panelLayer);
        const P = { x: 120, y: 290, w: 520, h: 640, band: 80 };
        svg("rect", { x: P.x + 10, y: P.y + 10, width: P.w, height: P.h, rx: 32, class: "shade" }, panel);
        svg("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: 32, class: "panel" }, panel);
        svg("path", { d: `M${P.x},${P.y + P.band} V${P.y + 32} A32,32 0 0 1 ${P.x + 32},${P.y} H${P.x + P.w - 32} A32,32 0 0 1 ${P.x + P.w},${P.y + 32} V${P.y + P.band} Z`, class: "band" }, panel);
        svg("line", { x1: P.x, y1: P.y + P.band, x2: P.x + P.w, y2: P.y + P.band, class: "band-line" }, panel);
        svg("rect", { x: P.x, y: P.y, width: P.w, height: P.h, rx: 32, class: "outline" }, panel);
        sk.stickerText(panel, props.storm, P.x + P.w / 2, P.y + P.band / 2 + 2, 56);
        const cloud = sk.cloud(panel, 380, 470, 0.9);
        cloud.removeAttribute("data-decor");
        tl.from(panel, { scale: 0.85, opacity: 0, svgOrigin: `${P.x + P.w / 2} ${P.y + P.h / 2}`, duration: 0.6, ease: "back.out(1.4)" }, at);
        const bolt = svg("g", {}, panelLayer);
        sk.sticker(bolt, "polygon", { points: "400,515 330,615 378,615 334,705 456,585 404,585 440,515" }, "face-blue", 8);
        tl.from(bolt, { scale: 0.4, opacity: 0, svgOrigin: "390 510", duration: 0.35, ease: "expo.out" }, at + 0.5);
        const counter = sk.pill(panelLayer, `0 s`, 380, 775, 200, 90, { rot: -4, tone: "navy", size: 56 });
        const counterTexts = counter.face.querySelectorAll("text");
        tl.from(counter.g, { scale: 0.6, opacity: 0, svgOrigin: "380 775", duration: 0.4, ease: "back.out(1.6)" }, at + 0.9);
        const count = { n: 0 };
        tl.to(count, {
          n: props.seconds, duration: 1.2, ease: "none",
          onUpdate: () => counterTexts.forEach((t) => { t.textContent = `${Math.floor(count.n)} s`; }),
        }, at + 1.2);
        const km = sk.label(panelLayer, props.stormDistance, 380, 872, "t56b", "middle");
        writeIn(tl, km, at + 2.5, 0.4);
        tl.addLabel("trueno");

        // mensaje: the satellite sends a bubble with its name and the time; it travels halfway down
        at = tl.duration();
        const bubble = svg("g", {}, bubbleLayer);
        const B = { x: SAT.x, y: 520, w: 540, h: 150 };
        const tail = `${B.x - 26},${B.y - B.h / 2 + 3} ${B.x},${B.y - B.h / 2 - 34} ${B.x + 26},${B.y - B.h / 2 + 3}`;
        sk.sticker(bubble, "rect", { x: B.x - B.w / 2, y: B.y - B.h / 2, width: B.w, height: B.h, rx: 32 }, "panel", 10);
        svg("polygon", { points: tail, class: "panel" }, bubble);
        svg("rect", { x: B.x - 30, y: B.y - B.h / 2 + 3, width: 60, height: 8, fill: "var(--paper)" }, bubble);
        text(bubble, props.bubble[0], { x: B.x, y: B.y - 30, class: "bubble-text", "text-anchor": "middle", "dominant-baseline": "central", style: "font-size:44px" });
        text(bubble, props.bubble[1], { x: B.x, y: B.y + 32, class: "bubble-text", "text-anchor": "middle", "dominant-baseline": "central", style: "font-size:44px" });
        tl.from(bubble, { scale: 0.3, opacity: 0, svgOrigin: `${SAT.x} ${SAT.y + 60}`, duration: 0.5, ease: "back.out(1.6)" }, at);
        tl.to(bubble, { y: 60, duration: 0.9, ease: "power2.inOut" }, at + 0.5);
        tl.addLabel("mensaje");

        // llega: the bubble drops into the phone; the phone's clock, the delay, and the distance it means
        at = tl.duration();
        tl.to(bubble, { y: 250, scale: 0.15, opacity: 0, svgOrigin: `${B.x} ${B.y}`, duration: 0.5, ease: "power3.in" }, at);
        tl.to(phone.g, { x: 6, y: 6, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, at + 0.5);
        const arrival = gps.tag(resultLayer, props.arrival, 990, 470, { size: 40, rot: -2 });
        tl.from(arrival, { scale: 0.6, opacity: 0, svgOrigin: "990 470", duration: 0.45, ease: "back.out(1.6)" }, at + 0.65);
        const delay = gps.tag(resultLayer, props.delay, 1000, 600, { size: 48, rot: 3 });
        tl.from(delay, { scale: 0.6, opacity: 0, svgOrigin: "1000 600", duration: 0.45, ease: "back.out(1.6)" }, at + 1.0);
        const down = sk.arrow(resultLayer, { x: 1000, y: 658 }, { x: 1000, y: 740 }, { tone: "ink", w: 10 });
        tl.from(down, { scale: 0.1, opacity: 0, svgOrigin: "1000 658", duration: 0.35, ease: "expo.out" }, at + 1.3);
        const distance = sk.stickerText(resultLayer, props.distance, 1000, 820, 96, { tone: "blue" });
        distance.classList.add("distance");
        tl.from(distance, { scale: 0.6, opacity: 0, svgOrigin: "1000 820", duration: 0.5, ease: "back.out(1.6)" }, at + 1.5);
        tl.addLabel("llega");

        return tl;
      },
    });
  })();
</script>
