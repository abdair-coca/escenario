<!--
  three-circles: continues from one-circle (same map, ring #1, pins and pill), which clears away. Satellite #2 adds
  a ring that crosses the first in two points; satellite #3 adds a ring through only one of them. That point
  becomes the blue dot: «¡aquí!».
-->
<template>
  <style></style>
</template>
<script src="/player/vendor/gsap/DrawSVGPlugin.min.js"></script>
<script src="/library/shared/scene-kit.js"></script>
<script src="/library/shared/sticker-kit.js"></script>
<script src="kit.js"></script>
<script>
  (function () {
    const { svg, canvas, writeIn, block } = window.sceneKit;
    const sk = window.stickerKit;
    const gps = window.gps;

    // Same layout as the end of one-circle, so the cut between them is seamless.
    const PIN_ANGLES = [null, 95, 180, 300];
    const TAG_ANGLE = 240;

    registerScene({
      id: "three-circles",
      props: {
        previous: "Una distancia no basta", // headline of one-circle, cleared on entrance
        headline: "Tres círculos, un punto", // headline, top left
        distance: "21 000 km", // tag on ring #1 (as in one-circle)
        which: "¿cuál?", // pill of one-circle, cleared on entrance
        here: "¡aquí!", // sticker on the blue dot
      },
      steps: ["dos", "tres", "aqui"],
      build(root, props, gsap) {
        gps.setup(root);
        const stage = canvas(root);
        const mapLayer = svg("g", {}, stage);
        const ringLayer = svg("g", {}, stage);
        const satLayer = svg("g", {}, stage);
        const pinLayer = svg("g", {}, stage);
        const tagLayer = svg("g", {}, stage);
        const tl = gsap.timeline();
        const { P, SATS } = gps;
        const Q = gps.otherCrossing();
        const S1 = SATS[1];
        const r1 = gps.radius(1);
        const onRing = (deg) => ({ x: S1.x + r1 * Math.cos((deg * Math.PI) / 180), y: S1.y + r1 * Math.sin((deg * Math.PI) / 180) });

        // Entrance: the last picture of one-circle, already in place; its pins, pill and headline go out.
        gps.cityMap(mapLayer);
        const ring1 = gps.ring(ringLayer, S1, r1, true);
        gps.satellite(satLayer, S1.x, S1.y, 0.6, 1);
        const tp = onRing(TAG_ANGLE);
        gps.tag(tagLayer, props.distance, tp.x, tp.y, { size: 40, rot: -4 });
        const oldPins = PIN_ANGLES.map((deg) => {
          const p = deg === null ? P : onRing(deg);
          return gps.pin(pinLayer, p.x, p.y, "?").g;
        });
        const oldPill = sk.pill(tagLayer, props.which, 1320, 400, 300, 100, { rot: 5, tone: "blue", size: 56 }).g;
        const oldHeadline = block(root, props.previous, { x: 160, y: 96, className: "t96" });
        tl.to([...oldPins, oldPill, oldHeadline], { opacity: 0, duration: 0.3, ease: "power3.in", stagger: 0.04 }, 0.1);
        writeIn(tl, block(root, props.headline, { x: 160, y: 96, className: "t96" }), 0.5, 0.7);

        // dos: satellite #2 and its ring; the two crossing points get pins
        let at = tl.duration();
        const add = (n) => {
          const s = SATS[n];
          const sat = gps.satellite(satLayer, s.x, s.y, 0.6, n);
          tl.from(sat.g, { scale: 0.6, opacity: 0, svgOrigin: `${s.x} ${s.y}`, duration: 0.5, ease: "back.out(1.6)" }, at);
          const ring = gps.ring(ringLayer, s, gps.radius(n), true);
          tl.from(ring, { drawSVG: "0%", duration: 1.1, ease: "power2.inOut" }, at + 0.3);
          return ring;
        };
        // just after the hold, so the ring is still in focus at the step that drew it
        const unfocus = (ring, when) => tl.set(ring, { attr: { class: "ring" } }, when + 0.05);
        unfocus(ring1, at);
        const ring2 = add(2);
        const pinP = gps.pin(pinLayer, P.x, P.y, "?");
        const pinQ = gps.pin(pinLayer, Q.x, Q.y, "?");
        [pinP, pinQ].forEach((pin, i) => {
          tl.from(pin.g, { y: -70, opacity: 0, duration: 0.45, ease: "back.out(1.6)" }, at + 1.3 + i * 0.12);
        });
        tl.addLabel("dos");

        // tres: satellite #3 and its ring through only one of the two pins; the other one is discarded
        at = tl.duration();
        unfocus(ring2, at);
        add(3);
        tl.set(pinQ.head, { attr: { class: "face-muted" } }, at + 1.4);
        tl.addLabel("tres");

        // aqui: the remaining pin turns into the blue dot, with «¡aquí!»
        at = tl.duration();
        tl.to(pinP.g, { scale: 0.2, opacity: 0, svgOrigin: `${P.x} ${P.y}`, duration: 0.3, ease: "power3.in" }, at);
        const dot = gps.blueDot(pinLayer, P.x, P.y, 26);
        tl.from(dot, { scale: 0.2, opacity: 0, svgOrigin: `${P.x} ${P.y}`, duration: 0.5, ease: "back.out(2)" }, at + 0.2);
        const here = sk.stickerText(tagLayer, props.here, P.x, P.y + 110, 96, { tone: "blue" });
        tl.from(here, { scale: 0.6, opacity: 0, svgOrigin: `${P.x} ${P.y + 110}`, duration: 0.5, ease: "back.out(1.6)" }, at + 0.45);
        tl.addLabel("aqui");

        return tl;
      },
    });
  })();
</script>
